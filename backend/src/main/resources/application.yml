spring:
  application:
    name: lifetrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lifetrack}
    username: ${DB_USERNAME:lifetrack}
    password: ${DB_PASSWORD:lifetrack}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
  # SMTP for verification and password reset codes. Spring Boot reads
  # SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD
  # from the environment; without SPRING_MAIL_HOST e-mails are only logged.
  # (spring.mail.host is not listed here: any value, even empty, would enable SMTP.)
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  flyway:
    # Databases created before Flyway (by ddl-auto=update) already match V1.
    baseline-on-migrate: true
    baseline-version: 1
server:
  port: ${SERVER_PORT:8080}
  # Finish in-flight requests on shutdown (deploys, restarts).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Only the health check, for load balancers and container platforms.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # An unreachable SMTP server must not mark the app unhealthy and get it restarted.
      enabled: false

cors:
  # Comma separated. Production: set CORS_ALLOWED_ORIGIN_PATTERNS to the real web origin(s).
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

jwt:
  # Required. Must be at least 32 bytes for HS256.
  secret: ${JWT_SECRET}
  # Access token lifetime; clients renew it with the refresh token.
  expiration: ${JWT_EXPIRATION_MS:900000}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

security:
  failed-attempts:
    # Wrong passwords allowed per window, for login (per IP + e-mail) and for
    # password checks of a signed-in user (change password, delete account).
    max-per-account: ${LOGIN_MAX_FAILURES_PER_ACCOUNT:5}
    # Failed logins allowed per IP across all accounts.
    max-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:20}
    window-minutes: ${LOGIN_FAILURE_WINDOW_MINUTES:15}

app:
  mail:
    from: ${MAIL_FROM:LifeTrack <no-reply@localhost>}
