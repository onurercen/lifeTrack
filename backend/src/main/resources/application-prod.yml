# Production settings, enabled with SPRING_PROFILES_ACTIVE=prod.
# Database, JWT and CORS values still come from environment variables (see docs/deployment.md).

server:
  # The app runs behind a reverse proxy (Caddy, Railway, Fly) that terminates HTTPS.
  # Take the client IP and scheme from X-Forwarded-* so the per-IP login limit sees
  # real clients. Tomcat only trusts these headers from private network addresses
  # (TRUSTED_PROXIES overrides that regex); the app must not be reachable directly.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|::1|0:0:0:0:0:0:0:1|fd[0-9a-f]{2}:.*}
  error:
    include-message: never
    include-stacktrace: never

spring:
  jpa:
    show-sql: false

# No public API browser in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cors:
  # The web app is served from the same origin as the API, so no cross-origin
  # access is needed. Set CORS_ALLOWED_ORIGIN_PATTERNS only for another web origin.
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}

app:
  mail:
    # Verification and password reset depend on e-mail; refuse to start without SMTP.
    required: true
